title: 源码分析笔记
tagline: 读真实代码，理解系统设计
description: 围绕云原生与 LLM 基础设施的源码分析博客 · 第一系列：CloudWeGo eino
url: "https://wangtuo.github.io"
baseurl: "/spool"
lang: zh-CN

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  input: GFM

permalink: /posts/:year/:month/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: zh-CN

exclude:
  - archive
  - backup
  - node_modules
  - test-results
  - .agents
  - .worktrees
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
