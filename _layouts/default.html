<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}" />
  <script src="{{ '/assets/toc.js' | relative_url }}" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="site-tagline">{{ site.tagline }}</p>

      <nav class="sidebar-nav">
        <a href="{{ '/' | relative_url }}" class="nav-item{% if page.url == '/' %} active{% endif %}">首页</a>
        <a href="{{ '/series/' | relative_url }}" class="nav-item{% if page.url contains '/series/' %} active{% endif %}">系列</a>
        <a href="{{ '/about/' | relative_url }}" class="nav-item{% if page.url == '/about/' %} active{% endif %}">关于</a>
      </nav>

      <div class="sidebar-series">
        <h3 class="sidebar-heading">系列</h3>
        {% for s in site.data.series %}
        <a href="{{ s.permalink | relative_url }}" class="nav-item series-item{% if page.url contains s.permalink %} active{% endif %}">{{ s.title }}</a>
        {% endfor %}
      </div>
    </div>
  </aside>

  {% if page.date %}
  <div class="article-area">
    <div class="article-content">
      {{ content }}
      <footer class="site-footer">
        <p>{{ site.tagline }} · 旧学习地图应用归档于仓库 <code>archive/</code> 目录</p>
      </footer>
    </div>
    <aside class="toc-sidebar">
      <p class="toc-title">目录</p>
      <ul class="toc-list"></ul>
    </aside>
  </div>
  {% else %}
  <div class="main-area">
    {{ content }}
    <footer class="site-footer">
      <p>{{ site.tagline }} · 旧学习地图应用归档于仓库 <code>archive/</code> 目录</p>
    </footer>
  </div>
  {% endif %}
</body>
</html>
